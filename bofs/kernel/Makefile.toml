[env]
CARGO_TARGET_DIR = "target"
LIBS = "-lkernel32 -ladvapi32 -lbcrypt -lntdll -lfltlib"
NAME = "kernel"
OUT_DIR = "out"

[tasks.create-out]
description = "Create output directory"
script_runner = "@duckscript"
script = "mkdir ${OUT_DIR}"

[tasks.build-x64]
description = "Build the x64 static library"
command = "cargo"
args = [
    "build",
    "--offline",
    "--release",
    "--target",
    "x86_64-pc-windows-gnu",
]

[tasks.build-adapted-x64]
description = "Build the x64 static library with the external Rust adapter ABI"
command = "cargo"
args = [
    "build",
    "--offline",
    "--release",
    "--features",
    "external-adapter",
    "--target",
    "x86_64-pc-windows-gnu",
]

[tasks.link-adapted-x64]
description = "Link the operational x64 BOF with a user-supplied Rust adapter library"
script_runner = "@shell"
script = "boflink --mingw64 ${LIBS} --warn-unresolved-symbols --gc-sections --entry=go target/x86_64-pc-windows-gnu/release/lib${NAME}.a ${ADAPTER_LIB} -o ${OUT_DIR}/${NAME}.x64.o"
dependencies = ["build-adapted-x64", "create-out"]

[tasks.link-x64]
description = "Link the x64 Beacon Object File"
script_runner = "@shell"
script = "boflink --mingw64 ${LIBS} --warn-unresolved-symbols --gc-sections --entry=go target/x86_64-pc-windows-gnu/release/lib${NAME}.a -o ${OUT_DIR}/${NAME}.x64.o"
dependencies = ["build-x64", "create-out"]

[tasks.build-all]
description = "Build and link x64"
dependencies = ["link-x64"]

[tasks.default]
alias = "build-all"
